[package]
name = "classic-win-games"
version = "0.1.0"
description = "Offline classic card games"
authors = ["J. Schell"]
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
